# dashboards.yml
# ------------------------------------------------------------------
# Ye file grafana ko bolti hai "dashboards folder me jo bhi .json hai
# usko khud utha lo, UI se manually import karne ki zarurat nahi".
# (Structure me maanga nahi gaya tha ye file, but isके bina teeno
# dashboard json files bekaar padi rahengi, isliye add kar di.)

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Server Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
