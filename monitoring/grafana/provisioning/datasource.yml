# datasource.yml
# ------------------------------------------------------------------
# Grafana start hote hi ye file khud-ba-khud Prometheus aur Loki
# datasources add kar deti hai - manually UI me jaake add karne ki
# zarurat nahi. Bas isse Grafana ke provisioning/datasources folder
# me copy hona chahiye (apply_config.sh ye kaam karti hai).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://__SERVER_IP__:__PROMETHEUS_PORT__
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://__SERVER_IP__:__LOKI_PORT__
    editable: true
    jsonData:
      maxLines: 1000
